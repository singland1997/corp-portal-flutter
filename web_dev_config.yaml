# Local dev server for `flutter run -d chrome` / `-d web-server`.
# Same routing as corp-portal-ui/proxy.conf.json: /api/v1/* goes to the 4 local backend services.
# Only used by the Flutter dev server; deployed builds call API_BASE_URL directly.
server:
  host: localhost
  port: 4300
  proxy:
    # identity-service
    - regex: "^/api/v1/(auth|users|roles)(/|$)"
      target: "http://127.0.0.1:4101"
    # corporate-service
    - regex: "^/api/v1/corporates(/|$)"
      target: "http://127.0.0.1:4102"
    # inventory/pool service
    - regex: "^/api/v1/(pools|sims|packages|sim-operations)(/|$)"
      target: "http://127.0.0.1:4103"
    # dashboard/usage/report/billing service
    - regex: "^/api/v1/(dashboard|usage|reports|report-jobs|invoices)(/|$)"
      target: "http://127.0.0.1:4104"
